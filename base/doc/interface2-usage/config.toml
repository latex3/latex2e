# Configuration for update-usage.py (usage lists in interface2.tex)

[sweep]
# Tree to search. Leave empty to use $TEXMFDIST/tex/latex of the
# TeX installation found via kpsewhich; --texmf overrides both.
texmf = ""

# Top-level directories (bundles) below tex/latex that belong to the
# core and are therefore not searched.
exclude_dirs = [
  "base", "base-dev", "tools", "tools-dev", "graphics", "graphics-dev",
  "amsmath", "amsmath-dev", "firstaid", "firstaid-dev",
  "latex-lab", "latex-lab-dev", "l3kernel", "l3kernel-dev",
  "l3backend", "l3backend-dev",
  # packages of the LaTeX team merged into the kernel (xparse, xtemplate,
  # l3keys2e) or kept for compatibility (xfp); their files may use and
  # even define kernel internals
  "l3packages",
]

# File types searched.
extensions = [".sty", ".cls", ".def", ".clo", ".cfg", ".ldf", ".fdd",
              ".code.tex", ".tex"]

# Files to skip entirely: regular expressions matched (re.search)
# against the bare file name, so anchor them, e.g. "^unhook\\.tex$".
# Use it for files whose changes are deliberate breakage or otherwise
# useless for the usage lists. (Could also drop the dated rollback
# copies of packages, e.g. "-\\d{4}-\\d\\d-\\d\\d\\.".)
ignore_files = [
  "^unhook\\.tex$",     # deliberately disables kernel hooks/commands
  "^blog\\.sty",        # attempting to generate html
]


[registers]
# Commands that are TeX registers or parameters. For these assignments
# (\X=..., \X 3pt, \setlength\X, \advance\X, \setcounter{...}) count as
# changes, not only (re)definitions. Add new register entries here.
names = [
  "c@errorcontextlines", "c@localmathalphabets", "c@bottomnumber",
  "bigskipamount", "medskipamount", "smallskipamount",
  "topsep", "partopsep", "itemsep", "parsep",
  "leftmargin", "rightmargin", "listparindent",
  "leftmargini", "leftmarginii", "leftmarginiii",
  "leftmarginiv", "leftmarginv", "leftmarginvi",
  "@beginparpenalty", "@itempenalty", "@endparpenalty",
  "@lowpenalty", "@medpenalty", "@highpenalty",
  "@listdepth", "@topsep", "@topsepadd",
  "@tempcnta", "@tempcntb", "@tempdima", "@tempdimb", "@tempdimc",
  "@tempskipa", "@tempskipb", "@tempboxa",
  "@savsk", "@savsf", "series@check@toks", "every@math@size",
  "lower@bound", "upper@bound", "errorcontextlines",
  "XeTeXuseglyphmetrics", "XeTeXdashbreakstate",
  "@math@level", "@flushglue",
  # ltlists
  "itemindent", "labelwidth", "labelsep", "linewidth", "@totalleftmargin",
  "@outerparskip", "@enumdepth", "@itemdepth", "par@deathcycles", "@labels",
  # ltfloat
  "footnotesep", "@floatpenalty",
  # ltmiscen
  "@verbvisiblespacebox", "@rightskip",
  # ltfiles
  "@clubpenalty",
]
# Token registers (also registers; in addition \X{...}, \X\expandafter{...},
# \X=\Y and \addto@hook\X{...} count as changes)
toks = [
  "everymath", "everydisplay", "everypar", "everycr", "everyjob", "output",
  "errhelp", "@temptokena", "toks@", "LaTeXReleaseInfo",
  "every@math@size", "series@check@toks",
]


[toplevel_only]
# Commands that packages legitimately switch off or replace locally, e.g.
# \let\label\relax while typesetting material a second time (TOC entries,
# measuring), to avoid duplicate labels. For these, only changes at the
# top level of a file count (also inside \AtBeginDocument, \AddToHook,
# \@ifpackageloaded and similar wrappers, which run once); changes inside
# other code, including plain {...} groups, are treated as uses.
names = ["label", "index", "glossary",
         # local wrappers in list/theorem packages (keytheorems, varwidth, ...)
         "trivlist", "endtrivlist"]


# Manual corrections, applied after the sweep. Use them for cases the
# rules get wrong and that are not worth a rule of their own.
#
#   command  name without backslash
#   package  as shown in the lists (.sty/.cls without extension,
#            other files with extension)
#   status   "reader"   -> list the package as user, not as modifier
#            "modifier" -> list it as modifier (missed by the rules)
#            "none"     -> drop it from both lists
#   reason   free text, for the next person reading this

[[override]]
command = "let"
package = "AlProTex"
status  = "reader"
reason  = "\\futurelet\\let:val -- ':' is a letter there, so \\let:val is a different command"

[[override]]
command = "if@newlist"
package = "flowfram"
status  = "reader"
reason  = "copy of the kernel's save/restore of \\if@newlist around shipout in \\@outputpage"

[[override]]
command = "if@newlist"
package = "flowfram-2014-09-30"
status  = "reader"
reason  = "copy of the kernel's save/restore of \\if@newlist around shipout in \\@outputpage"

[[override]]
command = "if@newlist"
package = "flowfram-2025-08-23"
status  = "reader"
reason  = "copy of the kernel's save/restore of \\if@newlist around shipout in \\@outputpage"

[[override]]
command = "if@newlist"
package = "flowfram-xetex-bidi.def"
status  = "reader"
reason  = "copy of the kernel's save/restore of \\if@newlist around shipout in \\@outputpage"

[[override]]
command = "if@newlist"
package = "latex-xetex-bidi.def"
status  = "reader"
reason  = "copy of the kernel's save/restore of \\if@newlist around shipout in \\@outputpage"

[[override]]
command = "if@newlist"
package = "newlfm"
status  = "reader"
reason  = "copy of the kernel's save/restore of \\if@newlist around shipout in \\@outputpage"


[sources]
# Where the kernel sources live (relative to this directory) and which
# files count: those included by doc/source2e.tex plus EXTRA. The source
# file of each documented command is shown as a margin note; it is taken
# from the `macro` environments in the dtx files, otherwise from the
# first definition in the code.
dir = "../.."
include_list = "doc/source2e.tex"
extra = ["classes", "latexrelease", "latex209"]
