name: Publish nightly

on:
  push:
    branches:
      - nightshade

permissions:
  contents: read
  id-token: write

jobs:
  l3build:
    runs-on: ubuntu-latest
    name: Publish nightly
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install TeX Live
        uses: zauguin/install-texlive@v4
        with:
          package_file: .github/tl_packages
      - name: Publish nightly
        run: |
          ID_TOKEN=$(curl -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://nightly.typesetting.eu" | jq -r .value)
          while read package directory; do (
            cd "$directory"
            mkdir target
            export TEXMFHOME="$(pwd)/target"
            LATEX_NIGHTLY=1 l3build install
            (
              cd target
              zip -r - . | curl --fail --data-binary @- -XPUT -H "Authorization: Bearer $ID_TOKEN" https://nightly.typesetting.eu/upload/"$package-nightly"
            )
            LATEX_NIGHTLY=1 l3build uninstall
            l3build install
            (
              cd target
              zip -r - . | curl --fail --data-binary @- -XPUT -H "Authorization: Bearer $ID_TOKEN" https://nightly.typesetting.eu/upload/"$package-dev"
            )
            l3build uninstall
          ) &
          done << EOF
          latex-base base
          latex-amsmath required/amsmath
          latex-firstaid required/firstaid
          latex-graphics required/graphics
          latex-lab required/latex-lab
          latex-tools required/tools
          EOF
          wait
