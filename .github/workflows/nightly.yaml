name: Publish nightly

on:
  push:
    branches:
      - nightshade

permissions:
  contents: read
  id-token: write

jobs:
  l3build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - package: latex-base-nightly
            directory: base
          - package: latex-amsmath-nightly
            directory: required/amsmath
          - package: latex-firstaid-nightly
            directory: required/firstaid
          - package: latex-graphics-nightly
            directory: required/graphics
          - package: latex-lab-nightly
            directory: required/latex-lab
          - package: latex-tools-nightly
            directory: required/tools
    name: Publish ${{ matrix.package }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install TeX Live
        uses: zauguin/install-texlive@v4
        with:
          package_file: .github/tl_packages
      - name: Create target directory
        run: mkdir target
      - name: Run l3build
        working-directory: ${{ matrix.directory }}
        run: LATEX_NIGHTLY=1 l3build install --texmfhome $GITHUB_WORKSPACE/target
      - name: Publish nightly
        working-directory: target
        run: |
          ID_TOKEN=$(curl -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://nightly.typesetting.eu" | jq -r .value)
          zip -r - . | curl --fail --data-binary @- -XPUT -H "Authorization: Bearer $ID_TOKEN" https://nightly.typesetting.eu/upload/${{ matrix.package }}
